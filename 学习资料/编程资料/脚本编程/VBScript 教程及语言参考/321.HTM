<H5>描述</H5>
<BLOCKQUOTE>返回与指定的路径中某文件夹相应的 <b>Folder</b> 对象。</BLOCKQUOTE>

<H5>语法</H5>
<BLOCKQUOTE><b>object</b>.<b>GetFolder(</b><b>folderspec</b><b>)</b> 

<P><b>GetFolder</b> 方法的语法有以下部分：
<P>
<TABLE WIDTH=87% BORDER=1 CELLPADDING=5 CELLSPACING=0>
<TR VALIGN=TOP BGCOLOR="#DDDDDD">
<TD><FONT SIZE=2><b>部分</b></FONT></TD>
<TD><FONT SIZE=2><b>描述</b></FONT></TD></TR>
<tr valign=top><td><font size=2><b>object</b></font></td>
<td><font size=2>必选。应为 <b>FileSystemObject</b> 的名称。</font></td></tr>
<tr valign=top><td><font size=2><b>folderspec</b></font></td>
<td><font size=2>必选。<b>folderspec</b> 是指定文件夹的路径（绝对路径或相对路径）。</font></td></tr>


</TABLE></BLOCKQUOTE>

<H5>说明</H5>
<BLOCKQUOTE>
如果指定文件夹不存在，则会出现错误。
</BLOCKQUOTE>
