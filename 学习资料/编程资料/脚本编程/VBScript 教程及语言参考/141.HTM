<H5>描述</H5>
<BLOCKQUOTE>返回一个字符串，此字符串由包含在<A HREF="0.htm#defArray">数组</A>中的许多子字符串联接创建。
</BLOCKQUOTE>

<H5>语法</H5>
<BLOCKQUOTE><b>Join(</b><B>list</B>[，<B>delimiter</B>]<b>)</b><p>

 <b>Join</b> 函数的语法有以下参数：<p>

<TABLE WIDTH=87% BORDER=1 CELLPADDING=5 CELLSPACING=0>
<TR VALIGN=TOP BGCOLOR="#DDDDDD">
	<TD><FONT SIZE="2"><b>参数</b></FONT></TD>
		<TD><FONT SIZE="2"><b>描述</b></FONT></TD></TR>
<TR VALIGN=TOP>
	<TD><FONT SIZE="2"><B>list</B></FONT></TD>
		<TD><FONT SIZE="2">必选。包含要联接的子字符串一维数组。 </FONT></TD></TR>
<TR VALIGN=TOP>
	<TD><FONT SIZE="2"><B>delimiter</B></FONT></TD>
		<TD><FONT SIZE="2">可选。在返回字符串中用于分隔子字符串的字符。如果省略，将使用空字符 ("")。 如果 <B>delimiter</B> 是零长度字符串，则在同一列表中列出全部项，没有分界符。</FONT></TD></TR>
</TABLE>

</BLOCKQUOTE><P>
