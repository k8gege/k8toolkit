<H5>描述</H5>
<BLOCKQUOTE>返回表示数字符号的整数。</BLOCKQUOTE>

<H5>语法</H5>
<BLOCKQUOTE><b>Sgn(</b><B>number</B><b>)</b><P>
 <B>number</B> 参数可以是任意有效的<A HREF="0.htm#defNumericExpression">数值表达式</A>。</BLOCKQUOTE>

<H5>返回值</H5>
<BLOCKQUOTE> <B>Sgn</B> 函数有如下返回值：<P>

<TABLE WIDTH=87% BORDER=1 CELLPADDING=5 CELLSPACING=0>
<TR VALIGN=TOP BGCOLOR="#DDDDDD">
<TD><FONT SIZE="2"><b>如果 <B>number </B>为</b></FONT></TD>
<TD><FONT SIZE="2"><b>Sgn 返回</b></FONT></TD></TR>
<TR VALIGN=TOP>
<TD><FONT SIZE="2">大于零</FONT></TD>
<TD><FONT SIZE="2">1</FONT></TD></TR>
<TR VALIGN=TOP>
<TD><FONT SIZE="2">等于零</FONT></TD>
<TD><FONT SIZE="2">0</FONT></TD></TR>
<TR VALIGN=TOP>
<TD><FONT SIZE="2">小于零</FONT></TD>
<TD><FONT SIZE="2">-1</FONT></TD></TR></TABLE></BLOCKQUOTE>

<H5>说明</H5>
<BLOCKQUOTE> <B>number</B> 参数的符号决定 <b>Sgn</b> 函数的返回值。</BLOCKQUOTE>
