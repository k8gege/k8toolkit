	<TD WIDTH=15%><FONT SIZE=2><B>vbBlack</B></FONT></TD>

			<TD WIDTH= "*"><FONT SIZE=2>黑色</FONT></TD></TR>

<TR VALIGN=TOP>
	<TD WIDTH=15%><FONT SIZE=2><B>vbRed</B></FONT></TD>

<TR VALIGN=TOP>

<TR VALIGN=TOP>
