<H5>描述</H5>
<BLOCKQUOTE>返回 Boolean 值指明变量是否已初始化。</BLOCKQUOTE>

<H5>语法</H5>
<BLOCKQUOTE><b>IsEmpty(</b><B>expression</B><b>)</b><P>
 <B>expression</B> 参数可以是任意<A HREF="0.htm#defExpression">表达式</A>。然而，由于 <b>IsEmpty</b> 用于判断一个变量是否已初始化，故 <B>expression</B> 参数经常是一个<A HREF="0.htm#defVariable">变量</A>名。</BLOCKQUOTE><P>

<H5>说明</H5>
<BLOCKQUOTE>如果变量未初始化或显式地设置为 <A HREF="0.htm#defEmpty"><B>Empty</B></A>，则函数 <b>IsEmpty</b> 返回 <b>True</b>；否则函数返回 <b>False</b>。如果 <B>expression</B> 包含一个以上的变量，总返回 <b>False</b>。</BLOCKQUOTE>
