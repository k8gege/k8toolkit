<H5>描述</H5>
<BLOCKQUOTE>创建文件夹。</BLOCKQUOTE>

<H5>语法</H5>
<BLOCKQUOTE><b>object</b>.<b>CreateFolder(</b><b>foldername</b><b>)</b><P>
<b>CreateFolder</b> 方法的语法有以下部分：<P>

<TABLE WIDTH=87% BORDER=1 CELLPADDING=5 CELLSPACING=0>
<TR VALIGN=TOP BGCOLOR="#DDDDDD">
	<TD><FONT SIZE=2><b>部分</b></FONT></TD>
		<TD><FONT SIZE=2><b>描述</b></FONT></TD></TR>
<TR VALIGN=TOP>
	<TD><FONT SIZE=2><b>object</b></FONT></TD>
		<TD><FONT SIZE=2>必选。应为 <b>FileSystemObject</b> 对象的名称。</FONT></TD></TR>
<TR VALIGN=TOP>
	<TD><FONT SIZE=2><b>foldername</b></FONT></TD>
		<TD><FONT SIZE=2>必选。<A HREF="0.htm#defStringExpression">字符串表达式</A>，指明要创建的文件夹。</FONT></TD></TR>
</TABLE>
</BLOCKQUOTE>

<H5>说明</H5>
<BLOCKQUOTE>
如果指定的文件夹已经存在，则会出现错误。
</BLOCKQUOTE>
