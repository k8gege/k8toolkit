<H5>描述</H5>
<BLOCKQUOTE>返回表示十六进制数字值的字符串。</BLOCKQUOTE>

<H5>语法</H5>
<BLOCKQUOTE><b>Hex(</b><b>number</b><b>)</b><P>
 <b>number</b> 参数是任意有效的表达式。</BLOCKQUOTE>

<H5>说明</H5>
<BLOCKQUOTE>如果 <b>number</b> 参数不是整数，则在进行运算前将其四舍五入为最接近的整数。 <P>
<TABLE WIDTH=87% BORDER=1 CELLPADDING=5 CELLSPACING=0><TR VALIGN=TOP BGCOLOR="#DDDDDD">
<TD><FONT SIZE="2"><b>如果 <b>number</b> 是</b></FONT></TD>
<TD><FONT SIZE="2"><b>Hex 返回</b></FONT></TD></TR>
<TR VALIGN=TOP>
<TD><FONT SIZE="2"><A HREF="0.htm#defNull"><B>Null</B></A></FONT></TD>
<TD><FONT SIZE="2"><b>Null</b>。</FONT></TD></TR>
<TR VALIGN=TOP>
<TD><FONT SIZE="2"><b>Empty</b></FONT></TD>
<TD><FONT SIZE="2">零 (0)。</FONT></TD></TR>
<TR VALIGN=TOP>
<TD><FONT SIZE="2">其他数</FONT></TD>
<TD><FONT SIZE="2">最大到八位的十六进制字符。</FONT></TD></TR>
</TABLE><P>
您可以通过在数字前面添加前缀 &amp;H 来表示十六进制数。例如，在十六进制计数法中，&amp;H10 表示十进制数 16。</BLOCKQUOTE>
