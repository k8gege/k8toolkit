<H5>描述</H5>
<BLOCKQUOTE>
只读属性，返回 <b>TextStream</b> 文件中的当前行号。
</BLOCKQUOTE>

<H5>语法</H5>
<BLOCKQUOTE>
<B>object</B><b>.Line</b><p>
 <B>object</B> 通常是 <b>TextStream</b> 对象的名称。
</BLOCKQUOTE>

<H5>说明</H5>
<BLOCKQUOTE>
文件刚刚打开并在写入任何信息前，<b>Line</b> 等于 1。</BLOCKQUOTE>
