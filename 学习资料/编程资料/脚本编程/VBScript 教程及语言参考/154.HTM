<H5>描述</H5>
<BLOCKQUOTE>返回不带前导空格 (<b>LTrim</b>)、后续空格 (<b>RTrim</b>) 或前导与后续空格 (<b>Trim</b>) 的字符串副本。</BLOCKQUOTE>

<H5>语法</H5>
<BLOCKQUOTE><b>LTrim(</b><B>string</B><b>)<P>
RTrim(</b><B>string</B><b>)<P>
Trim(</b><B>string</B><b>)</b><P>

 <B>string</B> 参数是任意有效的<A HREF="0.htm#defStringExpression">字符串表达式</A>。如果 <B>string</B> 参数中包含 <A HREF="0.htm#defNull"><B>Null</B></A>，则返回 <b>Null</b>。</BLOCKQUOTE>
