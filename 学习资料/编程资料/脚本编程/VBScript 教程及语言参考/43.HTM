<HR noshade SIZE=2><br>
仅当<A HREF="0.htm#defTypeLibrary">类型库</A>包含以下常数定义，且在您的工程文件中已经显式引用该类型库后，才允许使用这些常数。对于 VBScript，必须在代码中显式声明这些常数。<p>

<BLOCKQUOTE><TABLE WIDTH=87% BORDER=1 CELLPADDING=5 CELLSPACING=0>
<TR VALIGN=TOP BGCOLOR="#DDDDDD">
	<TD WIDTH=15%><FONT SIZE=2><b>常数</b></font></TD>
		<TD ALIGN=CENTER WIDTH=10%><FONT SIZE=2><b>值</b></font></TD>
			<TD WIDTH="*"><FONT SIZE=2><b>描述</b></font></TD></TR>
<TR VALIGN=TOP>
	<TD WIDTH=15%><FONT SIZE=2><B>ForReading</B></font></TD>
		<TD ALIGN=CENTER WIDTH=10%><FONT SIZE=2>1</font></TD>
			<TD WIDTH= "*"><FONT SIZE=2>以只读方式打开文件。不能向该文件写入内容。</font></TD></TR>

<TR VALIGN=TOP>
	<TD WIDTH=15%><FONT SIZE=2><B>ForWriting</B></font></TD>
		<TD ALIGN=CENTER WIDTH=10%><FONT SIZE=2>2</font></TD>
			<TD WIDTH="*"><FONT SIZE=2>以可读写方式打开文件。如果已存在同名的文件，则覆盖旧的文件。</font></TD></TR>
<TR VALIGN=TOP>
	<TD WIDTH=15%><FONT SIZE=2><B>ForAppending</B></font></TD>
		<TD ALIGN=CENTER WIDTH=10%><FONT SIZE=2>8</font></TD>
			<TD WIDTH="*"><FONT SIZE=2>打开文件并在文件末尾写入内容。</font></TD></TR>
</TABLE></BLOCKQUOTE><P>
