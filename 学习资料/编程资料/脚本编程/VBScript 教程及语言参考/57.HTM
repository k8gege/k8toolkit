<H5>描述</H5>
<BLOCKQUOTE>返回数字的绝对值。</BLOCKQUOTE>

<H5>语法</H5>
<BLOCKQUOTE><b>Abs(</b><B>number</B><b>)</b><P>
 <B>number</B> 参数可以是任意有效的<A HREF="0.htm#defNumericExpression">数值表达式</A>。如果 <B>number</B> 包含 <A HREF="0.htm#defNull"><B>Null</B></A>，则返回 <b>Null</b>；如果是未初始化变量，则返回 0。</BLOCKQUOTE>

<H5>说明</H5>
<BLOCKQUOTE>数字的绝对值是其无符号的数值大小。例如，<b>Abs(</b>-1<b>)</b> 和 <b>Abs(</b>1<b>)</b> 都返回 1。</BLOCKQUOTE>
