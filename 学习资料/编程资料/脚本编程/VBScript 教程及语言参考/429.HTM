<H5>描述</H5>
<BLOCKQUOTE>用于两个数相除并返回以整数形式表示的结果。</BLOCKQUOTE>

<H5>语法</H5>
<BLOCKQUOTE><B>result</B> <b>=</b> <B>number1</B><b>\</b><B>number2</B><P>
 <b>\</b> 运算符的语法有以下部分：<P>

<TABLE WIDTH=87% BORDER=1 CELLPADDING=5 CELLSPACING=0>
<TR VALIGN=TOP BGCOLOR="#DDDDDD">
<TD><FONT SIZE="2"><b>部分</b></FONT></TD>
<TD><FONT SIZE="2"><b>描述</b></FONT></TD></TR>
<TR VALIGN=TOP>
	<TD><FONT SIZE="2"><B>result</B></FONT></TD>
		<TD><FONT SIZE="2">任意数值变量。</FONT></TD></TR>
<TR VALIGN=TOP>
	<TD><FONT SIZE="2"><B>number1</B></FONT></TD>
		<TD><FONT SIZE="2">任意<A HREF="0.htm#defNumericExpression">数值表达式</A>。</FONT></TD></TR>
<TR VALIGN=TOP>
	<TD><FONT SIZE="2"><B>number2</B></FONT></TD>
		<TD><FONT SIZE="2">任意数值表达式。</FONT></TD></TR></TABLE></BLOCKQUOTE>

<H5>说明</H5>
<BLOCKQUOTE>在除法操作前，数值表达式四舍五入为 <b>Byte</b>、<b>Integer</b> 或 <b>Long</b> 子类型表达式。<P>

如果任何表达式为 
<A HREF="0.htm#defNull"><B>Null</B></A>，<B>result</B> 也是 <b>Null</b>。任何表达式为 
<A HREF="0.htm#defEmpty"><B>Empty</B></A> 时，则按 0 处理。</BLOCKQUOTE>
