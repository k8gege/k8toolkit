<H5>描述</H5>
<BLOCKQUOTE>返回字符串的大写形式。</BLOCKQUOTE>

<H5>语法</H5>
<BLOCKQUOTE><b>UCase(</b><B>string</B><b>)</b><P>
 <B>string</B> 参数是任意有效的<A HREF="0.htm#defStringExpression">字符串表达式</A>。如果 <B>string</B> 参数中包含 <A HREF="0.htm#defNull"><B>Null</B></A>，则返回 <b>Null</b>。</BLOCKQUOTE>

<H5>说明</H5>
<BLOCKQUOTE>只有小写字母被转换成大写字母；所有大写字母和非字母字符均保持不变。</BLOCKQUOTE>
