<H5>描述</H5>
<BLOCKQUOTE>
	从 <b>TextStream</b> 文件中读入一整行字符（直到下一行，但不包括下一行字符），并返回结果字符串。</BLOCKQUOTE>

<H5>语法</H5>
<BLOCKQUOTE><B>object</B><b>.ReadLine</b><P>
 <B>object</B> 应为 <b>TextStream</b> 对象的名称。

</BLOCKQUOTE>
