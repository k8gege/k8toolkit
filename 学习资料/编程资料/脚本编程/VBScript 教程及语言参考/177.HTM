<H5>描述</H5>
<BLOCKQUOTE>返回按指定位数进行四舍五入的数值。</BLOCKQUOTE>

<H5>语法</H5>
<BLOCKQUOTE><b>Round(</b><B>expression</B>[<B>,</B> <B>numdecimalplaces</B>]<b>)</b><P>

 <b>Round</b> 函数的语法有以下参数：<P>

<TABLE WIDTH=87% BORDER=1 CELLPADDING=5 CELLSPACING=0>
<TR VALIGN=TOP BGCOLOR="#DDDDDD">
	<TD><FONT SIZE="2"><b>参数</b></FONT></TD>
		<TD><FONT SIZE="2"><b>描述</b></FONT></TD></TR>
<TR VALIGN=TOP>
	<TD WIDTH=15%><FONT SIZE="2"><B>expression</B></FONT></TD>
		<TD WIDTH=85%><FONT SIZE="2">必选。进行四舍五入的数值表达式。</FONT></TD></TR>
<TR VALIGN=TOP>
	<TD WIDTH=15%><FONT SIZE="2"><B>numdecimalplaces</B></FONT></TD>
		<TD WIDTH=155%><FONT SIZE="2">可选。数字表明小数点右边有多少位进行四舍五入。如果省略，则 <b>Round</b> 函数返回整数。 </FONT></TD></TR>

</TABLE>
</BLOCKQUOTE><p>
