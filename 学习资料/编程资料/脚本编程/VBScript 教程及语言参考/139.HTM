<H5>描述</H5>
<BLOCKQUOTE>返回 Boolean 值指明表达式是否引用了有效的 <A HREF="0.htm#defOLEAutomationObject">Automation 对象</A>。</BLOCKQUOTE>

<H5>语法</H5>
<BLOCKQUOTE><b>IsObject(</b><B>expression</B><b>)</b><P>
 <B>expression</B> 参数可以是任意<A HREF="0.htm#defExpression">表达式</A>。</BLOCKQUOTE>

<H5>说明</H5>
<BLOCKQUOTE>如果 <B>expression</B> 是 <b>Object</b> 子类型变量或用户自定义的对象，则 <b>IsObject</b> 返回 <b>True</b>；否则函数返回 <b>False</b>。  </BLOCKQUOTE>
