<H5>描述</H5>
<BLOCKQUOTE>返回一个 <b>Folder</b> 对象，表示指定驱动器的根文件夹。只读。</BLOCKQUOTE>

<H5>语法</H5>
<BLOCKQUOTE><b>object</b>.<b>RootFolder</b>

<P><b>object</b> 应为 <b>Drive</b> 对象的名称。
</BLOCKQUOTE>

<H5>说明</H5>
<BLOCKQUOTE>
使用返回的 <b>Folder</b> 对象，可以访问指定驱动器包含的所有文件和文件夹。
</BLOCKQUOTE>
