<H5>描述</H5>
<BLOCKQUOTE>返回 Boolean 值指明表达式的值是否为数字。</BLOCKQUOTE>

<H5>语法</H5>
<BLOCKQUOTE><b>IsNumeric(</b><B>expression</B><b>)</b><P>
 <B>expression</B> 参数可以是任意<A HREF="0.htm#defExpression">表达式</A>。</BLOCKQUOTE>

<H5>说明</H5>
<BLOCKQUOTE>如果整个 <B>expression</B> 被识别为数字，<b>IsNumeric</b> 函数返回 <b>True</b>；否则函数返回 <b>False</b>。<P>
 如果 <B>expression</B> 是<A HREF="0.htm#defDateExpression">日期表达式</A>，<b>IsNumeric</b> 函数返回 <b>False</b>。
</BLOCKQUOTE>
