<H5>描述</H5>
<BLOCKQUOTE>返回使用的 Script 引擎的主版本号。</BLOCKQUOTE>

<H5>语法</H5>
<BLOCKQUOTE><b>ScriptEngineMajorVersion</b></BLOCKQUOTE>

<H5>说明</H5>
<BLOCKQUOTE>返回值直接对应于所使用的 Script 程序语言中 DLL 文件包含的版本信息。</BLOCKQUOTE>
