<H5>描述</H5>
<BLOCKQUOTE>返回某个角的余弦值。</BLOCKQUOTE>

<H5>语法</H5>
<BLOCKQUOTE><b>Cos(</b><b>number</b><b>)</b><P>
<b>number</b> 参数可以是任何将某个角表示为弧度的有效<A HREF="0.htm#defNumericExpression">数值表达式</A>。</BLOCKQUOTE>

<H5>说明</H5>
<BLOCKQUOTE> <b>Cos</b> 函数取某个角并返回直角三角形两边的比值。此比值是直角三角形中该角的邻边长度与斜边长度之比。<P>
结果范围在 -1 到 1 之间。<P>
将角度乘以 <A HREF="0.htm#defpi">pi</A>/180 即可转换为弧度，将弧度乘以 180/pi 即可转换为角度。</BLOCKQUOTE>
