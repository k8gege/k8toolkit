<H5>描述</H5>
<BLOCKQUOTE>用于包含程序中的解释性注释。</BLOCKQUOTE>

<H5>语法</H5>
<BLOCKQUOTE><b>Rem</b> <i>comment</i><P>或<P><b>'</b> <i>comment</i><P>
<i>comment</i> 参数是需要包含的注释文本。在 <b>Rem</b> 关键字和 <i>comment</i> 之间应有一个空格。</BLOCKQUOTE>

<H5>说明</H5>
<BLOCKQUOTE>正如“语法”部分所示，可以用单引号 (<b>'</b>) 代替 <b>Rem</b> 关键字。如果 <b>Rem</b> 关键字和语句在同一行，需要用分号来分隔它们。但如果使用单引号，则不需要在单引号和语句之间使用分号。</BLOCKQUOTE>
