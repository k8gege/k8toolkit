<H5>描述</H5>
<BLOCKQUOTE>返回 1 到 31 之间的一个整数（包括 1 和31），代表某月中的一天。</BLOCKQUOTE>

<H5>语法</H5>
<BLOCKQUOTE><b>Day(</b><B>date</B><b>)</b><P>
 <B>date</B> 参数是任意可以代表日期的表达式。如果 <B>date</B> 参数中包含 <A HREF="0.htm#defNull"><B>Null</B></A>，则返回 <b>Null</b>。</BLOCKQUOTE>
