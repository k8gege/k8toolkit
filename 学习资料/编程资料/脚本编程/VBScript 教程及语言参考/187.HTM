<H5>描述</H5>
<BLOCKQUOTE>返回 0 到 59 之间的一个整数（包括 1 和 59），代表一分钟内的某一秒。</BLOCKQUOTE>

<H5>语法</H5>
<BLOCKQUOTE><b>Second(</b><B>time</B><b>)</b><P>
 <B>time</B> 参数是任意可以代表时间的表达式。如果 <B>time</B> 参数中包含 <A HREF="0.htm#defNull"><B>Null</B></A>，则返回 <b>Null</b>。</BLOCKQUOTE>
