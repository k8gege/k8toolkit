<H5>描述</H5>
<BLOCKQUOTE>
	向 <b>TextStream</b> 文件写入指定字符串和新行字符。</BLOCKQUOTE>

<H5>语法</H5>
<BLOCKQUOTE>
	<B>object</B><b>.WriteLine(</b>[<B>string</B>]<b>)</b><P>
 <b>WriteLine</b> 方法的语法有以下部分：<P>

<TABLE WIDTH=87% BORDER=1 CELLPADDING=5 CELLSPACING=0>
<TR VALIGN=TOP BGCOLOR="#DDDDDD">
	<TD><FONT SIZE="2"><b>部分</b></FONT></TD>
		<TD><FONT SIZE="2"><b>描述</b></FONT></TD></TR>
<TR VALIGN=TOP>
	<TD><FONT SIZE="2"><B>object</B></FONT></TD>
		<TD><FONT SIZE="2">必选。应为 <b>TextStream </b>对象的名称。</FONT></TD></TR>
<TR VALIGN=TOP>
	<TD><FONT SIZE="2"><B>string</B></FONT></TD>
		<TD><FONT SIZE="2">可选。要写入文件的文本。如果省略，将向文件写入新行字符。</FONT></TD></TR>
</TABLE>
</BLOCKQUOTE><P>
