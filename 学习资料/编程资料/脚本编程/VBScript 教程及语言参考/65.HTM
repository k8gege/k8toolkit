<H5>描述</H5>
<BLOCKQUOTE>返回表达式，此表达式已转换为 <b>Boolean</b> 子类型的 <b>Variant</b>。</BLOCKQUOTE>

<H5>语法</H5>
<BLOCKQUOTE><b>CBool(</b><B>expression</B><b>)</b><P>
 <B>expression</B> 是任意有效的表达式。</BLOCKQUOTE>

<H5>说明</H5>
<BLOCKQUOTE>如果 <B>expression</B> 是零，则返回 <b>False</b>；否则返回 <b>True</b>。如果 <B>expression</B> 不能解释为数值，则将发生<A HREF="0.htm#defRTErr">运行时错误</A>。 </BLOCKQUOTE>
