<H5>描述</H5>
<BLOCKQUOTE>返回表示数字八进制值的字符串。</BLOCKQUOTE>

<H5>语法</H5>
<BLOCKQUOTE><b>Oct(</b><b>number</b><b>)</b><P>
 <b>number</b> 参数是任意有效的表达式。</BLOCKQUOTE>

<H5>说明</H5>
<BLOCKQUOTE>如果 <b>number</b> 参数不是整数，则在进行运算前，将其四舍五入到最接近的整数。<P>

<TABLE WIDTH=87% BORDER=1 CELLPADDING=5 CELLSPACING=0>
<TR VALIGN=TOP BGCOLOR="#DDDDDD">
<TD><FONT SIZE="2"><b>如果 <b>number</b> 是</b></FONT></TD>
<TD><FONT SIZE="2"><b>Oct 返回</b></FONT></TD></TR>
<TR VALIGN=TOP>
<TD><FONT SIZE="2"><b><A HREF="0.htm#defNull"><B>Null</B></A></b></FONT></TD>
<TD><FONT SIZE="2"><b>Null</b>。</FONT></TD></TR>
<TR VALIGN=TOP>
<TD><FONT SIZE="2"><b>Empty</b></FONT></TD>
<TD><FONT SIZE="2">零 (0)。</FONT></TD></TR>
<TR VALIGN=TOP>
<TD><FONT SIZE="2">任意其他数字</FONT></TD>
<TD><FONT SIZE="2">最大可到 11 位的八进制字符。</FONT></TD></TR>
</TABLE><P>

用户也可以通过直接在数前加上 &amp;O 表示八进制数。例如，&amp;O10 为十进制数 8 的八进制表示法。</BLOCKQUOTE>
