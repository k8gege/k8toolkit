<H5>描述</H5>
<BLOCKQUOTE>如果在 <b>Dictionary</b> 对象中存在指定键，返回 <b>True</b>；如果不存在，返回 <b>False</b>。</BLOCKQUOTE>

<H5>语法</H5>
<BLOCKQUOTE><B>object</B><b>.</b><b>Exists(</b><B>key</B><b>)</b> <P>

 <b>Exists</b> 方法的语法有以下部分：<P>

<TABLE WIDTH=87% BORDER=1 CELLPADDING=5 CELLSPACING=0>
<TR VALIGN=TOP BGCOLOR="#DDDDDD">
	<TD><FONT SIZE="2"><b>参数</b></FONT></TD>
		<TD><FONT SIZE="2"><b>描述</b></FONT></TD></TR>
<TR VALIGN=TOP>
	<TD><FONT SIZE="2"><B>object</B></FONT></TD>
		<TD><FONT SIZE="2">必选。应为 <b>Dictionary</b> 对象的名称。</FONT></TD></TR>
<TR VALIGN=TOP>
	<TD><FONT SIZE="2"><B>key</B></FONT></TD>
		<TD><FONT SIZE="2">必选。<B>Key</B> 为在 <b>Dictionary</b> 对象中要查找的值。</FONT></TD></TR>
</TABLE>

</BLOCKQUOTE><p>
