<H5>描述</H5>
<BLOCKQUOTE>返回 Boolean 值指明某变量是否为<A HREF="0.htm#defArray">数组</A>。</BLOCKQUOTE>

<H5>语法</H5>
<BLOCKQUOTE><b>IsArray(</b><B>varname</B><b>)</b><P>
 <B>varname</B> 参数可以是任意<A HREF="0.htm#defVariable">变量</A>。</BLOCKQUOTE>

<H5>说明</H5>
<BLOCKQUOTE>如果变量是数组，<b>IsArray</b> 函数返回 <b>True</b>；否则，函数返回 <b>False</b>。当变量中包含有数组时，使用 <b>IsArray</b> 函数很有效。</BLOCKQUOTE>
