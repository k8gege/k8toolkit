<H5>描述</H5>
<BLOCKQUOTE>返回随机生成的临时文件或文件夹的名称，用于执行要求临时文件或文件夹的操作。</BLOCKQUOTE>

<H5>语法</H5>
<BLOCKQUOTE><b>object</b>.<b>GetTempName</b>

<P>可选参数 <b>object</b> 应为 <b>FileSystemObject</b> 对象的名称。

</BLOCKQUOTE>
<H5>说明</H5>
<BLOCKQUOTE>
<b>GetTempName</b> 方法不创建文件，该方法仅提供临时文件名。<b>CreateTextFile</b> 使用该临时文件名创建文件。
</BLOCKQUOTE>
