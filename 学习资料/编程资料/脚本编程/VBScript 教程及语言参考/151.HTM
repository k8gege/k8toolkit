<H5>描述</H5>
<BLOCKQUOTE>返回图片对象。</BLOCKQUOTE>

<H5>语法</H5>
<BLOCKQUOTE><b>LoadPicture(</b><B>picturename</B><b>)</b><P>
 <B>picturename</B> 参数是<A HREF="0.htm#defStringExpression">字符串表达式</A>，该表达式指明了要装入的图片文件的名称。</BLOCKQUOTE><P>

<H5>说明</H5>
<BLOCKQUOTE>可以由 <b>LoadPicture</b> 识别的图形格式有位图文件 (.bmp)、图标文件 (.ico)、行程编码文件 (.rle)、图元文件 (.wmf)、增强型图元文件 (.emf)、GIF (.gif) 文件和 JPEG (.jpg) 文件。
</BLOCKQUOTE>
