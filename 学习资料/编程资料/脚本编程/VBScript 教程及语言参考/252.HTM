<H5>描述</H5>
<BLOCKQUOTE>向 <b>Folders</b> 集合添加新 <b>Folder</b>。</BLOCKQUOTE>

<H5>语法</H5>
<BLOCKQUOTE><b>object</b><b>.</b><b>Add</b> <b>folderName</b>
<p><b>AddFolders</b> 方法的语法有以下部分：<p>

<TABLE WIDTH=87% BORDER=1 CELLPADDING=5 CELLSPACING=0>
<TR VALIGN=TOP BGCOLOR="#DDDDDD">
	<TD><FONT SIZE=2><b>部分</b></FONT></TD>
		<TD><FONT SIZE=2><b>描述</b></FONT></TD></TR>
<TR VALIGN=TOP>
	<TD><FONT SIZE=2><b>object</b></FONT></TD>
		<TD><FONT SIZE=2>必选。应为 <b>Folders</b> 集合的名称。</FONT></TD></TR>
<TR VALIGN=TOP>
	<TD><FONT SIZE=2><b>folderName</b></FONT></TD>
		<TD><FONT SIZE=2>必选。要添加的新 <b>Folder</b> 名称。</FONT></TD></TR>
</TABLE>
</BLOCKQUOTE>

<H5>说明</H5>
<BLOCKQUOTE>如果 <b>folderName</b> 已经存在，则会出现错误。</BLOCKQUOTE>
