<H5>描述</H5>
<BLOCKQUOTE>返回字符串，此字符串与指定字符串顺序相反。</BLOCKQUOTE>

<H5>语法</H5>
<BLOCKQUOTE><b>StrReverse(</b><B>string1</B><b>)</b><P>

 <B>string1</B> 参数是要进行字符反向的字符串。如果 <B>string1</B> 是零长度字符串 ("")，则返回零长度字符串。如果 <B>string1</B> 为 <b>Null</b>，则会出现错误。

</BLOCKQUOTE>
