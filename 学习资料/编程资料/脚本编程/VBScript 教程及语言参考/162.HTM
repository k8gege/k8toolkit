<H5>描述</H5>
<BLOCKQUOTE>返回表明指定月份的字符串。</BLOCKQUOTE>

<H5>语法</H5>
<BLOCKQUOTE><b>MonthName(</b><B>month</B>[<b>,</b> <B>abbreviate</B>]<b>)</b><P>

 <b>MonthName</b> 函数的语法有以下参数：<P>

<TABLE WIDTH=87% BORDER=1 CELLPADDING=5 CELLSPACING=0>
<TR VALIGN=TOP BGCOLOR="#DDDDDD">
	<TD><FONT SIZE="2"><b>参数</b></FONT></TD>
		<TD><FONT SIZE="2"><b>描述</b></FONT></TD></TR>
<TR VALIGN=TOP>
	<TD WIDTH=15%><FONT SIZE="2"><B>month</B></FONT></TD>
		<TD WIDTH=85%><FONT SIZE="2">必选。月份的数值定义。例如，一月是 1，二月是 2，以此类推。</FONT></TD></TR>
<TR VALIGN=TOP>
	<TD WIDTH=15%><FONT SIZE="2"><B>abbreviate</B></FONT></TD>
		<TD WIDTH=155%><FONT SIZE="2">可选。Boolean 值，表明月份名称是否简写。如果省略，默认值为 <b>False</b>，即不简写月份名称。</FONT></TD></TR>
</TABLE>
</BLOCKQUOTE><p>
