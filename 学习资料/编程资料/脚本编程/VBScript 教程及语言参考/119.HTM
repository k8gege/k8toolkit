<H5>描述</H5>
<BLOCKQUOTE>返回 0 到 23 之间的一个整数（包括 0 和 23），代表一天中的某一小时。</BLOCKQUOTE>

<H5>语法</H5>
<BLOCKQUOTE><b>Hour(</b><B>time</B><b>)</b><P>
 <B>time</B> 参数是任意可以代表时间的表达式。如果 <B>time</B> 参数中包含 <A HREF="0.htm#defNull"><B>Null</B></A>，则返回 <b>Null</b>。</BLOCKQUOTE>
