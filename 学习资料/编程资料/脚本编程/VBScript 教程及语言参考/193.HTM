<H5>描述</H5>
<BLOCKQUOTE>返回由指定数目的空格组成的字符串。</BLOCKQUOTE>

<H5>语法</H5>
<BLOCKQUOTE><b>Space(</b><B>number</B><b>)</b><P>
 <B>number</B> 参数为字符串中用户所需的空格数。</BLOCKQUOTE>
