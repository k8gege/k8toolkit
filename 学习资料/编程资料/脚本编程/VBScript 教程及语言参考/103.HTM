<H5>描述</H5>
<BLOCKQUOTE>返回 <B>e</B>（自然对数的底）的幂次方。</BLOCKQUOTE>

<H5>语法</H5>
<BLOCKQUOTE><b>Exp(</b><B>number</B><b>)</b><P>
 <B>number</B> 参数可以是任意有效的<A HREF="0.htm#defNumericExpression">数值表达式</A>。</BLOCKQUOTE>

<H5>说明</H5>
<BLOCKQUOTE>如果 <B>number</B> 参数超过 709.782712893，则出现错误。常数 <B>e</B> 的值约为 2.718282。
<TABLE CELLSPACING=0 CELLPADDING=0 BORDER=0 WIDTH=87%><TR><TD COLSPAN=2 VALIGN=BOTTOM><hr noshade size=1></TD></TR>
<TR><TD VALIGN=TOP><FONT SIZE="2"><b>注意</b> <b>Exp</b> 函数完成 <b>Log</b> 函数的反运算，并且有时引用为反对数形式。</FONT></TD></TR>
