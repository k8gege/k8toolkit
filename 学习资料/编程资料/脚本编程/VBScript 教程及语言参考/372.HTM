<H5>描述</H5>
<BLOCKQUOTE>
	读取 <b>TextStream</b> 文件时跳过指定数目的字符。</BLOCKQUOTE>

<H5>语法</H5>
<BLOCKQUOTE><b>object</b><b>.Skip(</b><b>characters</b><b>)</b><P>

<b>Skip</b> 方法的语法有以下部分：<P>

<TABLE WIDTH=87% BORDER=1 CELLPADDING=5 CELLSPACING=0>
<TR VALIGN=TOP BGCOLOR="#DDDDDD">
	<TD><FONT SIZE=2><b>部分</b></FONT></TD>
		<TD><FONT SIZE=2><b>描述</b></FONT></TD></TR>
<TR VALIGN=TOP>
	<TD><FONT SIZE=2><b>object</b></FONT></TD>
		<TD><FONT SIZE=2>必选。应为 <b>TextStream</b> 对象的名称。</FONT></TD></TR>
<TR VALIGN=TOP>
	<TD><FONT SIZE=2><b>characters</b></FONT></TD>
		<TD><FONT SIZE=2>必选。读取文件时跳过的字符数目。</FONT></TD></TR>
</TABLE>
</BLOCKQUOTE>

<H5>说明</H5>
<BLOCKQUOTE>
放弃跳过的字符。
</BLOCKQUOTE>
