<H5>描述</H5>
<BLOCKQUOTE>
	读入全部 <b>TextStream</b> 文件并返回结果字符串。</BLOCKQUOTE>

<H5>语法</H5>
<BLOCKQUOTE>
	<B>object</B><b>.</b><b>ReadAll</b><P>

 <B>object</B> 应为 <b>TextStream</b> 对象的名称。
</BLOCKQUOTE>


<H5>说明</H5>
<BLOCKQUOTE>
	对于大文件，使用 <b>ReadAll</b> 方法浪费内存资源。应该使用其他技术输入文件，例如按行读文件。</BLOCKQUOTE>
