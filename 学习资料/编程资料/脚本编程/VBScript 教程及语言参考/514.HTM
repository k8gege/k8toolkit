<H5>描述</H5>
<BLOCKQUOTE>
在 <b>Dictionary</b> 对象中设置 <B>key</B>。
</BLOCKQUOTE>

<H5>语法</H5>
<BLOCKQUOTE>
<B>object</B><b>.</b><b>Key(</b><B>key</B><b>)</b> = <B>newkey</B><b></b><p>

 <b>Key</b> 属性结构如下：<p>

<TABLE WIDTH=87% BORDER=1 CELLPADDING=5 CELLSPACING=0>
<TR VALIGN=TOP BGCOLOR="#DDDDDD">
<TD><FONT SIZE="2"><b>参数</b></FONT></TD>
<TD><FONT SIZE="2"><b>描述</b></FONT></TD></TR>
<TR VALIGN=TOP>
<TD><FONT SIZE="2"><B>object</B></FONT></TD>
<TD><FONT SIZE="2">必选。通常是 <b>Dictionary</b> 对象的名称。</FONT></TD></TR>
<TR VALIGN=TOP>
<TD><FONT SIZE="2"><B>key</B></FONT></TD>
<TD><FONT SIZE="2">必选。要改变的 <B>Key</B> 值。</FONT></TD></TR><TR VALIGN=TOP>
<TD><FONT SIZE="2"><B>newkey</B></FONT></TD>
<TD><FONT SIZE="2">必选。代替指定 <B>key</B> 值的新值。</FONT></TD></TR>
</TABLE>
</BLOCKQUOTE>

<H5>说明</H5>
<BLOCKQUOTE>
如果在更改 <B>key</B> 值时未找到 <B>key</B>，则出现<A HREF="0.htm#defRTErr">运行时错误</A>。
</BLOCKQUOTE>
